<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1050" role="img" aria-label="Ilustración conceptual del juego UCN">
<defs>
  <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#252d35"/><stop offset=".24" stop-color="#6b625b"/><stop offset=".5" stop-color="#2d292b"/><stop offset=".82" stop-color="#51423d"/><stop offset="1" stop-color="#0b1319"/></linearGradient>
  <radialGradient id="vignette"><stop offset=".3" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#010101" stop-opacity=".86"/></radialGradient>
  <radialGradient id="haze"><stop stop-color="#ff986d" stop-opacity=".67"/><stop offset="1" stop-color="#ff986d" stop-opacity="0"/></radialGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
  <filter id="eyeGlow" x="-150%" y="-250%" width="400%" height="600%"><feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".62" numOctaves="2" seed="9" stitchTiles="stitch" result="n"/><feColorMatrix in="n" type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".12"/></feComponentTransfer></filter>
  <pattern id="scan" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 0H8" stroke="#fff" stroke-opacity=".06"/></pattern>
</defs>
<defs><radialGradient id="light"><stop stop-color="#8a343b" stop-opacity=".78"/><stop offset=".43" stop-color="#8a343b" stop-opacity=".23"/><stop offset="1" stop-color="#8a343b" stop-opacity="0"/></radialGradient>
<linearGradient id="field" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#231018"/><stop offset=".5" stop-color="#181b20"/><stop offset="1" stop-color="#231018"/></linearGradient></defs>
<rect width="800" height="1050" fill="url(#field)"/>
<ellipse cx="390" cy="335" rx="500" ry="580" fill="url(#light)" filter="url(#blur)"/>
<path d="M0 0H800V1050H0Z" fill="url(#scan)" opacity=".6"/>
<g><g fill="#071012" stroke="#a36b6b" stroke-opacity=".44" stroke-width="14"><rect x="90" y="100" width="280" height="265" rx="8"/><rect x="432" y="110" width="283" height="255" rx="8"/><rect x="175" y="414" width="455" height="311" rx="8"/></g><g stroke="#f48a8e" stroke-opacity=".28" stroke-width="7" fill="none"><path d="M110 150L250 310L345 145"/><path d="M445 160L590 300L690 150"/><path d="M195 460L410 650L609 450"/></g><g fill="#ffb8c4" filter="url(#eyeGlow)"><circle cx="200" cy="260" r="18"/><circle cx="290" cy="260" r="18"/><circle cx="531" cy="260" r="18"/><circle cx="622" cy="260" r="18"/><circle cx="350" cy="580" r="26"/><circle cx="460" cy="580" r="26"/></g><path d="M0 780L800 730V1080H0Z" fill="#15121b"/><path d="M50 896H740 M50 930H740" stroke="#a45a60" opacity=".4" stroke-width="12"/></g>
<path d="M0 880Q400 805 800 885V1050H0Z" fill="#231018" opacity=".76"/>
